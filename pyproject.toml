[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "line-personal-mcp"
version = "0.6.0"
description = "Unofficial MCP server for a personal LINE account (chats, messages, send). Companion-device login via QR — your phone stays logged in."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "line-personal-mcp contributors" }]
keywords = ["line", "mcp", "model-context-protocol", "messaging"]
dependencies = [
    "mcp>=1.9,<2",
    "okline>=2.7.0,<2.8",  # line_mcp patches okline internals (E2EE); re-test before widening
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
line-mcp = "line_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/itsloukman/line-mcp"
okline = "https://github.com/nicedayzc/okline"

[tool.hatch.build.targets.wheel]
packages = ["line_mcp"]
